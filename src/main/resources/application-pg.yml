spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/healthcare_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update   # use validate in production
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always