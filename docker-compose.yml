version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: healthcare_postgres
    restart: always
    environment:
      POSTGRES_DB: healthcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: healthcare_app
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: pg

volumes:
  postgres_data: